<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
</head>
<body style="margin:0;padding:0;background:linear-gradient(135deg,#040518,#0E1043,#33225F);font-family:Arial,sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;">

    <div style="
        width:400px;
        max-width:90%;
        background:rgba(22,36,119,0.35);
        backdrop-filter:blur(15px);
        border:1px solid #5DA0DF;
        border-radius:20px;
        padding:40px 30px;
        box-shadow:0 0 25px rgba(30,153,229,0.4);
        text-align:center;
    ">

        <div style="
            width:80px;
            height:80px;
            margin:auto;
            border-radius:50%;
            background:linear-gradient(135deg,#244AB4,#1E99E5);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:35px;
            box-shadow:0 0 20px rgba(30,153,229,0.8);
        ">
            🔒
        </div>

        <h2 style="
            color:#EEE9F6;
            margin-top:25px;
            margin-bottom:10px;
            font-size:28px;
        ">
            Verify OTP
        </h2>

        <p style="
            color:#B0C5EC;
            margin-bottom:30px;
            line-height:1.6;
        ">
            Enter the verification code sent to your email or mobile number.
        </p>

        <div style="
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:25px;
        ">
            <input type="text" maxlength="1" style="
                width:55px;
                height:55px;
                border:none;
                border-radius:12px;
                text-align:center;
                font-size:22px;
                background:#0E1043;
                color:#EEE9F6;
                outline:none;
                box-shadow:0 0 10px rgba(30,153,229,0.3);
            ">

            <input type="text" maxlength="1" style="
                width:55px;
                height:55px;
                border:none;
                border-radius:12px;
                text-align:center;
                font-size:22px;
                background:#0E1043;
                color:#EEE9F6;
                outline:none;
                box-shadow:0 0 10px rgba(30,153,229,0.3);
            ">

            <input type="text" maxlength="1" style="
                width:55px;
                height:55px;
                border:none;
                border-radius:12px;
                text-align:center;
                font-size:22px;
                background:#0E1043;
                color:#EEE9F6;
                outline:none;
                box-shadow:0 0 10px rgba(30,153,229,0.3);
            ">

            <input type="text" maxlength="1" style="
                width:55px;
                height:55px;
                border:none;
                border-radius:12px;
                text-align:center;
                font-size:22px;
                background:#0E1043;
                color:#EEE9F6;
                outline:none;
                box-shadow:0 0 10px rgba(30,153,229,0.3);
            ">
        </div>

        <button style="
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#244AB4,#1E99E5);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 0 20px rgba(30,153,229,0.5);
        ">
            Verify OTP
        </button>

        <p style="
            margin-top:25px;
            color:#B0C5EC;
            font-size:14px;
        ">
            Didn't receive the code?
            <a href="#" style="
                color:#1E99E5;
                text-decoration:none;
                font-weight:bold;
            ">
                Resend OTP
            </a>
        </p>

        <div style="
            margin-top:20px;
            color:#7A5CA7;
            font-size:13px;
        ">
            OTP expires in 02:00 minutes
        </div>

    </div>

</body>
</html>
