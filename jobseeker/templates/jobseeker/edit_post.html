{% extends 'jobseeker/dashboard.html' %}
{% block css %}
<style>
body{
    background:#f4f7fb;
    margin: 0;
    padding: 0;
}

.post-wrapper{
    width:70%;
    margin-left:25%;
    margin-top:40px;
}

.post-card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:10px;
    padding:12px;
}

.btn-post{
    background:#0d6efd;
    color:white;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:600;
}

.btn-post:hover{
    background:#0b5ed7;
}

.back-btn{
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}

/* Mobile fix */
@media (max-width: 768px){
    .post-wrapper{
        width: 92%;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
    }

    .post-card{
        padding: 20px;
    }
}

@media (max-width: 576px){
    .post-wrapper{
        width: 95%;
    }

    .post-card{
        padding: 16px;
        border-radius: 12px;
    }
}
</style>
{% endblock %}
{% block maincontent %}
<div class="container">

    <div class="post-wrapper">

        <a href="{% url 'jobseeker:my_post' %}" class="back-btn">
            ← Back To My Feed
        </a>

        <div class="post-card">

            <h3 class="mb-4">
                Create New Post
            </h3>

            <form method="post" action="{% url 'jobseeker:edit_post' pk=pid.id %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">
                        Post Title
                    </label>
                    <input type="text" class="form-control" name="tital" value="{{pid.tital}}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>
                    <textarea rows="6" class="form-control" name="description">{{pid.description}}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Upload Image
                    </label>
                    <input type="file" class="form-control" name="image">
                </div>

                <input type="submit" class="btn-post" value="Publish Post">

            </form>

        </div>

    </div>

</div>
{% endblock %}
