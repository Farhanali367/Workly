<!-- login.html -->
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'account/login.css' %}">
</head>

<body>

    <div class="container-fluid main-container">
        <div class="row h-100">

            <!-- Left Side -->
            <div class="col-lg-6 left-panel d-none d-lg-flex">
                <div class="overlay"></div>

                <div class="content">
                    <h1>Find Your Dream Job</h1>
                    <p>
                        Connect with top companies, discover opportunities,
                        and build your professional future.
                    </p>

                    <div class="features">
                        <div class="feature-box">
                            <i class="bi bi-briefcase-fill"></i>
                            <span>1000+ Jobs</span>
                        </div>

                        <div class="feature-box">
                            <i class="bi bi-buildings-fill"></i>
                            <span>Top Companies</span>
                        </div>

                        <div class="feature-box">
                            <i class="bi bi-people-fill"></i>
                            <span>Professional Network</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side -->
            <div class="col-lg-6 form-section">
                <div class="login-card">

                    <div class="text-center mb-4">
                        {% if e_msg %}
                        <div class="alert alert-danger" role="alert">
                        {{e_msg}}
                        </div>
                        {% endif %}
                        <h2 class="title">Reset Password</h2>
                    </div>

                    <div class="tab-content">

                        <div class="tab-pane fade show active" id="jobseeker">

                            <form action="{% url 'account:reset_password' %}" method="post">
                                {%csrf_token%}

                                <div class="mb-3">
                                    <input type="hidden" name="email" value="{{e}}">
                                    <label class="form-label">Password</label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-lock-fill"></i>
                                        </span>

                                        <input type="password" class="form-control" placeholder="New Password" name="new_pass" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-lock-fill"></i>
                                        </span>

                                        <input type="password" class="form-control" placeholder="Conform Password" name="con_pass" required>
                                    </div>
                                </div>

                                <input type="submit" class="btn login-btn seeker-btn w-100" value="Update Password">

                            </form>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
